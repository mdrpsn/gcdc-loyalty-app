[project]
name = "gcdc-loyalty-app"
version = "0.1.0"
description = "Got Cha Dink Club loyalty application foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=46,<48",
    "Django>=6.1.1,<6.2",
    "gunicorn>=26.2,<27",
    "psycopg[binary]>=3.3.6,<3.4",
    "whitenoise>=6.12,<7",
]

[tool.uv]
package = false


[tool.ruff]
extend-exclude = ["staticfiles", "reclub", "landing"]

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]
# Django settings modules use star imports on purpose.
ignore = ["F403", "F405"]
